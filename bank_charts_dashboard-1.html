<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中澳八大银行历史股价交互图</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#162235;margin:0}header{padding:24px max(18px,4vw);background:#13243c;color:white}h1{margin:0 0 8px;font-size:25px}p{margin:6px 0;line-height:1.6}.wrap{padding:18px max(12px,3vw)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.chart{background:white;border:1px solid #dce3ea;border-radius:12px;overflow:hidden}.heading{padding:12px 16px;font-weight:700;border-bottom:1px solid #edf0f4}.widget{height:480px}.widget .tradingview-widget-container{height:100%;width:100%}.widget .tradingview-widget-container__widget{height:100%;width:100%}.note{color:#59677b;font-size:13px;margin:14px 0 20px}@media(max-width:900px){.grid{grid-template-columns:1fr}.widget{height:440px}}</style></head><body><header><h1>中国与澳大利亚八大银行 · 历史股价交互图</h1><p>八张图在同一页面｜可拖动、缩放、查看日期与价格｜澳股 AUD · 港股 HKD</p></header><main class="wrap"><p class="note">图表由 TradingView 在线加载，需要联网。默认月线以便查看长期趋势；可在每张图上切换日线及时间范围。不同图表的复权与数据权限由 TradingView 控制，不能据此声称已核实历史绝对最低成交价。</p><div class="grid" id="charts"></div><p class="note">数据和图表 © TradingView。部分交易所数据可能延迟。农业银行于2010年上市；其他银行的图表以可用上市历史为准。</p></main><script>const banks=[['CBA · Commonwealth Bank','ASX:CBA'],['NAB · National Australia Bank','ASX:NAB'],['Westpac · WBC','ASX:WBC'],['ANZ · ANZ Group','ASX:ANZ'],['工商银行 · ICBC','HKEX:1398'],['建设银行 · CCB','HKEX:939'],['农业银行 · ABC','HKEX:1288'],['中国银行 · BOC','HKEX:3988']];for(const [name,symbol] of banks){const section=document.createElement('section');section.className='chart';const heading=document.createElement('div');heading.className='heading';heading.textContent=name;section.appendChild(heading);const widget=document.createElement('div');widget.className='widget';widget.innerHTML='<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>';section.appendChild(widget);document.getElementById('charts').appendChild(section);const script=document.createElement('script');script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';script.async=true;script.textContent=JSON.stringify({autosize:true,symbol,interval:'M',timezone:'exchange',theme:'light',style:'3',locale:'en',withdateranges:true,hide_side_toolbar:true,hide_top_toolbar:false,allow_symbol_change:false,save_image:false,calendar:false,support_host:'https://www.tradingview.com'});widget.querySelector('.tradingview-widget-container').appendChild(script)}</script></body></html>
